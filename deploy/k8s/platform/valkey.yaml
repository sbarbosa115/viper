# Valkey for BullMQ. `noeviction` is required (ADR 0018); append-only file so queued research
# steps, emails and schedules survive restarts. Password: secret `valkey` (password).
apiVersion: v1
kind: Service
metadata:
  name: valkey
spec:
  clusterIP: None
  selector: { app: valkey }
  ports:
    - { name: valkey, port: 6379 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: valkey
spec:
  serviceName: valkey
  replicas: 1
  selector:
    matchLabels: { app: valkey }
  template:
    metadata:
      labels: { app: valkey }
    spec:
      containers:
        - name: valkey
          image: valkey/valkey:8
          args:
            - valkey-server
            - --appendonly
            - 'yes'
            - --maxmemory
            - 2gb
            - --maxmemory-policy
            - noeviction
            - --requirepass
            - $(VALKEY_PASSWORD)
          env:
            - name: VALKEY_PASSWORD
              valueFrom: { secretKeyRef: { name: valkey, key: password } }
          ports:
            - { name: valkey, containerPort: 6379 }
          readinessProbe:
            exec:
              command: ['sh', '-c', 'valkey-cli -a "$VALKEY_PASSWORD" --no-auth-warning ping | grep -q PONG']
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ['sh', '-c', 'valkey-cli -a "$VALKEY_PASSWORD" --no-auth-warning ping | grep -q PONG']
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { memory: 3Gi }
          volumeMounts:
            - { name: data, mountPath: /data }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests: { storage: 20Gi }
