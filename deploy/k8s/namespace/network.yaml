# Pods in other namespaces (the other app) can't reach Llyner's pods, MySQL and Valkey included.
# Allowed in: pods of this namespace, and Traefik (kube-system) for web traffic and certificate
# challenges. k3s enforces NetworkPolicy out of the box; the kubelet's probes are not affected.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: same-namespace-and-ingress-only
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
