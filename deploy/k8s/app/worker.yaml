# BullMQ workers (research runs, enrichment, emails, schedules). Same image as the api.
# worker.ts stops within about 25 s of SIGTERM; runs are resumable (FR-19), so a job cut short
# is picked up again by the next worker. One replica on purpose: the outbox relay and the
# schedulers run with concurrency 1 and assume a single consumer; give it more room instead.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels: { app: worker }
  template:
    metadata:
      labels: { app: worker }
    spec:
      imagePullSecrets: [{ name: ghcr }]
      terminationGracePeriodSeconds: 30
      securityContext: { runAsNonRoot: true, runAsUser: 1000 }
      containers:
        - name: worker
          image: ghcr.io/sbarbosa115/viper-api
          command: ['node', '--enable-source-maps', 'dist/worker.js']
          envFrom:
            - configMapRef: { name: app-config }
            - secretRef: { name: app-secrets }
          resources:
            requests: { cpu: '1', memory: 2Gi }
            limits: { memory: 3Gi }
