# The SPA under /app: the `web` target of the root Dockerfile (nginx serving apps/web/dist).
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector: { app: web }
  ports:
    - { name: http, port: 80, targetPort: 80 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 2
  revisionHistoryLimit: 10
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      imagePullSecrets: [{ name: ghcr }]
      containers:
        - name: web
          image: ghcr.io/sbarbosa115/viper-web
          ports:
            - { name: http, containerPort: 80 }
          readinessProbe:
            httpGet: { path: /app/, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 128Mi }
