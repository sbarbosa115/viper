# Llyner Leads on DigitalOcean App Platform: one environment (production) to start small.
# Setup and costs: docs/ops/digitalocean-setup.md. Reference: https://docs.digitalocean.com/products/app-platform/reference/app-spec/
#
# Secrets: this file holds NO values. Env vars with `type: SECRET` are set once in the control
# panel (app > Settings > App-Level Environment Variables) and App Platform keeps them encrypted.
# Never `doctl apps update --spec .do/app.yaml` an app whose secrets are set: a spec without
# values blanks them. To change the spec, follow "Changing the spec" in the setup guide.
#
# Routing (ADR 0016): /api and / go to the api service, /app to the SPA. Rules run most specific
# first. Provider, Claude, SMTP and Stripe keys are NOT here: they live in Platform settings (ADR 0012).
name: llyner-leads
region: nyc

alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED

# Domain not chosen yet. When it is, add (and point DNS as the setup guide says):
# domains:
#   - domain: example.com
#     type: PRIMARY

envs:
  # Infrastructure secrets only (stack.md "Secrets"). Values are set in the control panel.
  - key: DATABASE_URL
    scope: RUN_TIME
    type: SECRET
  - key: REDIS_URL
    scope: RUN_TIME
    type: SECRET
  - key: SESSION_SECRET
    scope: RUN_TIME
    type: SECRET
  - key: SETTINGS_ENCRYPTION_KEY
    scope: RUN_TIME
    type: SECRET
  - key: SENTRY_DSN
    scope: RUN_TIME
    type: SECRET
  # Not secret. The app's primary URL (the ondigitalocean.app URL until a domain is added); the
  # api uses it for the CSRF Origin check and the site's absolute links.
  - key: APP_URL
    scope: RUN_TIME
    value: ${APP_URL}
  - key: NODE_ENV
    scope: RUN_TIME
    value: production
  # The client's address for every IP limit (sign-ups, log-ins, the site forms, the global rate
  # limit). App Platform's edge sets do-connecting-ip and overwrites a client-sent one; when it is
  # missing, the api trusts exactly one X-Forwarded-For hop (the edge), never the client's entries.
  - key: CLIENT_IP_HEADER
    scope: RUN_TIME
    value: do-connecting-ip
  - key: TRUST_PROXY_HOPS
    scope: RUN_TIME
    value: '1'

services:
  - name: api
    dockerfile_path: Dockerfile # builds the `api` stage (TARGET defaults to api)
    source_dir: /
    github:
      repo: sbarbosa115/viper
      branch: main
      deploy_on_push: false # deploys are started by the approved GitHub Actions job only
    instance_size_slug: apps-s-1vcpu-0.5gb # $5/mo, smallest; fixed instances can't scale out
    instance_count: 1
    http_port: 3000
    health_check:
      # The real route (apps/api/src/shared/http/health.routes.ts): 200 when the database and
      # Valkey answer, 503 otherwise. A deploy only goes live when this passes.
      http_path: /api/health
      initial_delay_seconds: 10
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 6
    # No liveness check on purpose: a short database blip should not restart the api.

workers:
  - name: worker
    dockerfile_path: Dockerfile
    source_dir: /
    github:
      repo: sbarbosa115/viper
      branch: main
      deploy_on_push: false
    run_command: node --enable-source-maps dist/worker.js
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1

jobs:
  - name: migrate
    kind: PRE_DEPLOY # runs before the new api and worker go live; a failure stops the deploy
    dockerfile_path: Dockerfile
    source_dir: /
    github:
      repo: sbarbosa115/viper
      branch: main
      deploy_on_push: false
    run_command: node dist/scripts/migrate.js
    instance_size_slug: apps-s-1vcpu-0.5gb # billed only while it runs

static_sites:
  - name: web
    dockerfile_path: Dockerfile.web # its last stage runs the build, so output_dir exists
    source_dir: /
    github:
      repo: sbarbosa115/viper
      branch: main
      deploy_on_push: false
    output_dir: /app/apps/web/dist # the built SPA
    catchall_document: index.html # client-side routes like /app/leads load the SPA

ingress:
  rules:
    - match:
        path:
          prefix: /api
      component:
        name: api
        preserve_path_prefix: true # the api registers every route under /api
    - match:
        path:
          prefix: /app
      component:
        name: web # prefix trimmed: /app/assets/x.js is served from assets/x.js
    - match:
        path:
          prefix: /
      component:
        name: api # the public site, /terms, /sitemap.xml, /robots.txt, /site/*

# Existing managed clusters, created once in the control panel (setup guide step 3). Attaching
# them here adds the app to each cluster's trusted sources. The connection strings themselves are
# the DATABASE_URL and REDIS_URL secrets above (mysql2 needs its own TLS parameter, see the guide).
databases:
  - name: db
    engine: MYSQL
    production: true
    cluster_name: llyner-mysql
    db_name: viper
    db_user: viper
  - name: valkey
    engine: VALKEY
    production: true
    cluster_name: llyner-valkey
