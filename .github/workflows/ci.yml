name: CI
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  # deploy.yml runs these same checks before it deploys.
  workflow_call:

concurrency:
  # Called from deploy.yml, the group gets its own name so a push can't cancel a release's checks.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: ./dev install
      - name: Lint
        run: ./dev lint
      - name: Typecheck
        run: ./dev typecheck
      - name: Test
        run: ./dev test
      - name: Build
        run: ./dev build
      - name: Audit
        run: ./dev npm audit --omit=dev --audit-level=high
