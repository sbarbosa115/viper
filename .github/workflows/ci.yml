name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: ./dev install
      - name: Lint
        run: ./dev lint
      - name: Typecheck
        run: ./dev typecheck
      - name: Test
        run: ./dev test
      - name: End-to-end
        run: ./dev e2e
      - name: Build
        run: ./dev build
      - name: Audit
        run: ./dev npm audit --omit=dev --audit-level=high
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
