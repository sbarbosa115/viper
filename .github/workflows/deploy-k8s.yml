# Deploys Llyner Leads to the k3s server (deploy/k8s, guide: docs/ops/kubernetes-setup.md).
# Manual only: Actions > Deploy (Kubernetes) > Run workflow. It runs the full checks, builds and
# pushes the images, waits for the founder's approval (GitHub environment `production`, required
# reviewer), backs up MySQL, runs migrations, rolls out the app and smoke-tests it.
#
# Needs on the `production` environment: secret KUBE_CONFIG (base64 kubeconfig written by
# deploy/server/llyner-setup.sh) and variables APP_URL (https://leads.llyner.com), SERVER_IP (the
# server's public IP) and PRE_CUTOVER ('true' until DNS points at the server).
name: Deploy (Kubernetes)
on:
  workflow_dispatch:
    inputs:
      reason:
        description: What this release ships (shown in the run title)
        required: false

run-name: Deploy k8s ${{ github.ref_name }}@${{ github.sha }} ${{ inputs.reason }}

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/sbarbosa115
  NS: llyner

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  images:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: api image (also the worker and the migrate job)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          push: true
          tags: ${{ env.REGISTRY }}/viper-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: web image (the SPA behind nginx)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          push: true
          tags: ${{ env.REGISTRY }}/viper-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  deploy:
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4

      - name: Connect to the cluster
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          test -n "$KUBE_CONFIG" || { echo "::error::Set the KUBE_CONFIG secret on the production environment."; exit 1; }
          test -n "${{ vars.APP_URL }}" || { echo "::error::Set the APP_URL variable on the production environment."; exit 1; }
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl -n "$NS" get deploy,statefulset

      - name: Pin this release's images
        run: |
          sed -i "s|newTag: .*|newTag: ${GITHUB_SHA}|" deploy/k8s/app/kustomization.yaml deploy/k8s/migrate/kustomization.yaml
          kubectl kustomize deploy/k8s/app | grep 'image:'

      - name: Platform (MySQL, Valkey, backups, routing)
        run: |
          kubectl apply -k deploy/k8s/platform
          kubectl -n "$NS" rollout status statefulset/mysql --timeout=10m
          kubectl -n "$NS" rollout status statefulset/valkey --timeout=5m

      - name: Back up MySQL before migrating
        run: |
          job="backup-pre-${GITHUB_SHA::7}-${GITHUB_RUN_ATTEMPT}"
          kubectl -n "$NS" create job "$job" --from=cronjob/mysql-backup
          ./deploy/server/wait-job.sh "$NS" "$job" 1200

      - name: Migrate (a failure stops the release; the old version keeps running)
        run: |
          kubectl -n "$NS" delete job migrate --ignore-not-found --wait=true
          kubectl apply -k deploy/k8s/migrate
          ./deploy/server/wait-job.sh "$NS" migrate 900

      - name: Roll out api, worker and web
        run: |
          kubectl apply -k deploy/k8s/app
          for d in api worker web; do
            kubectl -n "$NS" annotate deployment "$d" kubernetes.io/change-cause="${GITHUB_SHA} ${{ inputs.reason }}" --overwrite
          done
          for d in api worker web; do
            kubectl -n "$NS" rollout status deployment/"$d" --timeout=5m
          done

      - name: Smoke test (against this server, whatever DNS says)
        env:
          URL: ${{ vars.APP_URL }}
          SERVER_IP: ${{ vars.SERVER_IP }}
          # 'true' until DNS points here and Let's Encrypt has issued the certificate (guide step 7).
          PRE_CUTOVER: ${{ vars.PRE_CUTOVER }}
        run: |
          set -euo pipefail
          test -n "$SERVER_IP" || { echo "::error::Set the SERVER_IP variable on the production environment."; exit 1; }
          host=${URL#https://}; host=${host%%/*}
          opts=(--resolve "$host:443:$SERVER_IP")
          [ "$PRE_CUTOVER" = true ] && opts+=(--insecure) && echo "::warning::PRE_CUTOVER: certificate not checked"
          health=$(curl -fsS "${opts[@]}" --retry 5 --retry-delay 5 --retry-all-errors "$URL/api/health")
          echo "/api/health: $health"
          echo "$health" | jq -e '.status == "ok"' > /dev/null
          for path in / /terms /robots.txt /app/; do
            code=$(curl -s "${opts[@]}" -o /dev/null -w '%{http_code}' --retry 3 --retry-all-errors "$URL$path")
            echo "$path: $code"
            [ "$code" = "200" ]
          done

      - name: What went wrong and how to roll back
        if: failure()
        run: |
          kubectl -n "$NS" get pods -o wide || true
          kubectl -n "$NS" get events --sort-by=.lastTimestamp | tail -30 || true
          for d in api worker; do kubectl -n "$NS" logs deployment/"$d" --tail=80 || true; done
          cat <<EOF
          ::error::The release failed. To go back to the previous version of the app:
            kubectl -n $NS rollout undo deployment/api deployment/worker deployment/web
          Migrations are not undone. To restore the database from the backup taken before this
          release, see docs/ops/kubernetes-setup.md (Restore a backup).
          EOF
